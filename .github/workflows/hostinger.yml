name: Prepare Hostinger on main

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hostinger-build
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - name: Verify static output
        run: |
          test -s dist/index.html
          test -s dist/.htaccess
          test -d dist/_astro
          test ! -d dist/server
          test ! -d dist/api
      - name: Update compiled site on main
        run: |
          git add --all dist
          if git diff --cached --quiet; then
            echo 'Static output is unchanged.'
            exit 0
          fi
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo 'A newer main commit exists; its workflow will build the latest source.'
            exit 0
          fi
          source_sha="$(git rev-parse HEAD)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Build from $source_sha [skip ci]"
          git push origin HEAD:refs/heads/main
